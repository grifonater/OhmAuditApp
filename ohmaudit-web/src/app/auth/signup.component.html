<main class="auth-page">
  <section class="auth-card">
    <a class="brand" routerLink="/">Ohm Audit</a>
    <p class="eyebrow">Get started</p>
    <h1>Create your account</h1>
    @if (sent()) {
      <div class="notice" role="status">
        <h2>Check your email</h2>
        <p>Use the verification link, then return here to sign in.</p>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label>Your name<input formControlName="displayName" autocomplete="name" /></label
        ><label>Email<input type="email" formControlName="email" autocomplete="email" /></label
        ><label
          >Password<input
            type="password"
            formControlName="password"
            autocomplete="new-password"
          /><small>Use at least 10 characters.</small></label
        >
        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }
        <button type="submit" [disabled]="busy() || form.invalid">
          {{ busy() ? 'Creating…' : 'Create account' }}
        </button>
      </form>
    }
    <p>Already registered? <a routerLink="/login">Sign in</a></p>
  </section>
</main>
