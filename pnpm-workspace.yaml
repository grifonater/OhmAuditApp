packages:
  - "ohmaudit-web"
  - "ohmaudit-api"
  - "ohmaudit-contracts"
  - "ohmaudit-worker-*"
  - "ohmaudit-infra"
  - "ohmaudit-docs"
allowBuilds:
  '@prisma/engines': true
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  workerd: true
  prisma: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260813.1'
